[project]
name = "relay-pipeline-observatory"
version = "0.1.0"
description = "Recoverable, locally scheduled transport-data pipelines with evidence and lineage"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "pyarrow"]
[dependency-groups]
dev = ["pytest", "ruff"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I"]
